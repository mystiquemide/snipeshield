<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnipeShield Deploy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B0D10; --panel:#13171C; --line:#232A33; --text:#E6EDF3; --muted:#8B98A5; --green:#3DDC97; --red:#FF5D5D; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter, system-ui, sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p { color:var(--muted); }
  .step { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:10px 0; display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
  .step .t { font-weight:600; }
  .step .s { font-family:"JetBrains Mono", monospace; font-size:12px; color:var(--muted); word-break:break-all; }
  .ok { color:var(--green) !important; } .err { color:var(--red) !important; }
  button { font:inherit; font-weight:600; border:0; background:var(--text); color:var(--bg); border-radius:8px; padding:10px 16px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; font-family:"JetBrains Mono", monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Deploy SnipeShield to X Layer mainnet</h1>
  <p>Four transactions from your own wallet. Your key never leaves the wallet. Cost is about 0.009 OKB plus gas.</p>
  <button id="go">Connect and deploy</button>
  <div id="steps"></div>
  <pre id="out" hidden></pre>
</div>
<script type="module">
import { ethers } from "./ethers.min.js";
import D from "./deploy-data.js";

const FACTORY = "0x1f09daefa827f02cbb40967cc91b259763760761";
const SUPPLY = 1_000_000n;
const PRICE = ethers.parseEther("0.00001");
const STORY = "SnipeShield: launch-tax policy processor. Circuits here decide anti-snipe tax tiers for ShieldTokens. Transistor supply 1,000,000 (fixed cap), price 0.00001 OKB each.";
const EXPLORER = "https://www.oklink.com/xlayer";
const KEY = "snipeshield-deploy";

const steps = [
  ["Create SHIELD processor via TapeOut factory", "cpu"],
  ["Mint " + D.gates + " NAND transistors", "mint"],
  ["Tape out the default policy circuit", "tapeout"],
  ["Deploy ShieldLauncher", "launcher"],
];
const $ = (id) => document.getElementById(id);
$("steps").innerHTML = steps.map(([t, k]) => `<div class="step"><div class="t">${t}</div><div class="s" id="s-${k}">pending</div></div>`).join("");

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const mark = (k, html, cls = "ok") => { $("s-" + k).innerHTML = html; $("s-" + k).className = "s " + cls; };
const txLink = (h) => `<a class="ok" href="${EXPLORER}/tx/${h}" target="_blank">${h.slice(0, 10)}…</a>`;
for (const [, k] of steps) if (state[k + "Tx"]) mark(k, txLink(state[k + "Tx"]));

const parse = (c, rc, name) => rc.logs.map((l) => { try { return c.interface.parseLog(l); } catch { return null; } }).find((e) => e && e.name === name);

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    const eth = window.okxwallet || window.ethereum;
    if (!eth) throw new Error("No wallet found");
    await eth.request({ method: "eth_requestAccounts" });
    try { await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0xc4" }] }); }
    catch (e) {
      if (e.code !== 4902) throw e;
      await eth.request({ method: "wallet_addEthereumChain", params: [{ chainId: "0xc4", chainName: "X Layer", rpcUrls: ["https://rpc.xlayer.tech"], nativeCurrency: { name: "OKB", symbol: "OKB", decimals: 18 }, blockExplorerUrls: [EXPLORER] }] });
    }
    const signer = await new ethers.BrowserProvider(eth).getSigner();
    state.deployer = await signer.getAddress();

    const factory = new ethers.Contract(FACTORY, [
      "function createCPU(string,string,string,uint256,uint256) payable returns (address,address)",
      "function deployFee() view returns (uint256)",
      "event CPUCreated(address indexed circuits, address indexed transistors, address indexed creator, string name, uint256 supply, uint256 mintPrice)",
    ], signer);

    if (!state.processor) {
      mark("cpu", "confirm in wallet…", "");
      const rc = await (await factory.createCPU("SnipeShield", "SHIELD", STORY, SUPPLY, PRICE, { value: await factory.deployFee() })).wait();
      const ev = parse(factory, rc, "CPUCreated").args;
      Object.assign(state, { processor: ev.circuits, transistors: ev.transistors, cpuTx: rc.hash }); save();
      mark("cpu", txLink(rc.hash));
    }

    const transistors = new ethers.Contract(state.transistors, ["function mint(uint256,uint256) payable", "function protocolFee() view returns (uint256)"], signer);
    if (!state.mintTx) {
      mark("mint", "confirm in wallet…", "");
      const rc = await (await transistors.mint(0, D.gates, { value: PRICE * BigInt(D.gates) + await transistors.protocolFee() })).wait();
      state.mintTx = rc.hash; save(); mark("mint", txLink(rc.hash));
    }

    const circuits = new ethers.Contract(state.processor, [
      "function tapeout(bytes,uint32,uint32) payable returns (uint256)", "function TAPEOUT_FEE() view returns (uint256)",
      "event TapedOut(uint256 indexed circuitId, address indexed author, uint32 gateCount, uint32 nState)",
    ], signer);
    if (!state.tapeoutTx) {
      mark("tapeout", "confirm in wallet…", "");
      const rc = await (await circuits.tapeout(D.netlist, D.nIn, D.nOut, { value: await circuits.TAPEOUT_FEE() })).wait();
      state.circuitId = parse(circuits, rc, "TapedOut").args.circuitId.toString();
      state.tapeoutTx = rc.hash; save(); mark("tapeout", txLink(rc.hash));
    }

    if (!state.launcher) {
      mark("launcher", "confirm in wallet…", "");
      const cf = new ethers.ContractFactory(["constructor(address)"], D.launcherBytecode, signer);
      const c = await cf.deploy(FACTORY);
      const rc = await c.deploymentTransaction().wait();
      state.launcher = await c.getAddress(); state.launcherTx = rc.hash; save(); mark("launcher", txLink(rc.hash));
    }

    $("out").hidden = false;
    $("out").textContent = "Send this block back to Claude:\n\n" + JSON.stringify({ factory: FACTORY, ...state }, null, 2);
  } catch (e) {
    $("out").hidden = false;
    $("out").textContent = "Error: " + (e.shortMessage || e.message) + "\nYou can press the button again; finished steps are skipped.";
    $("out").className = "err";
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
